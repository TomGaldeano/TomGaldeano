<!DOCTYPE html>
<title>Tom's reportoire</title>
</head>
 <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<body class="d-flex flex-column min-vh-100 justify-content-between light">
  <nav class="navbar navbar-expand-sm bg-secondary">
    <div class="container-fluid bg-secondary">
      <ul class="nav justify-content-start">
        <li class="nav-item text-white bg-secondary">
          <a class="nav-link green_hover" href="{{ url_for('home') }}">Home</a>
        </li>
        <li class="nav-item text-white bg-secondary dropdown">
          <a class="nav-link green_hover dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
            id="dropdownMenuLink" aria-expanded="false">Projects</a>
          <ul class="bg-secondary dropdown-menu" aria-labelledby="dropdownMenuLink">
            <li class="text-white">
              <a class="link-item green_hover" href="{{ url_for('personal')}}">Personal Websites</a>
            </li>
            <li class="text-white">
              <a class="link-item green_hover" href="{{ url_for('games')}}">Games</a>
            </li>
            <li class="text-white">
              <a class="link-item green_hover" href="{{ url_for('ordered')}}">Ordered Websites</a>
            </li>
            <li class="text-white">
              <a class="link-item green_hover" href="{{ url_for('clock') }}">Clock</a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- Auth nav: right side -->
      <ul class="nav ms-auto justify-content-end align-items-center">
        {% if current_user.is_authenticated %}
          {% if current_user.is_admin %}
            <li class="nav-item text-white bg-secondary">
              <a class="nav-link green_hover fw-bold text-warning" href="{{ url_for('user.admin') }}" id="nav-admin">
                ⚙️ Admin
              </a>
            </li>
          {% endif %}
          <li class="nav-item text-white bg-secondary">
            <a class="nav-link green_hover" href="{{ url_for('user.profile') }}" id="nav-profile">
              👤 {{ current_user.username }}
            </a>
          </li>
          <li class="nav-item text-white bg-secondary">
            <a class="nav-link green_hover" href="{{ url_for('auth.logout') }}" id="nav-logout">Logout</a>
          </li>
        {% else %}
          <li class="nav-item text-white bg-secondary">
            <a class="nav-link green_hover" href="{{ url_for('auth.login') }}" id="nav-login">Login</a>
          </li>
          <li class="nav-item text-white bg-secondary">
            <a class="nav-link green_hover" href="{{ url_for('auth.register') }}" id="nav-register">Register</a>
          </li>
        {% endif %}
      </ul>

      <button id="color_changer"></button>
    </div>
  </nav>
